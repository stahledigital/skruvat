<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="skruvat-flyttad">
<title>Skruvat har flyttat – Ståhle Digital</title>
<link rel="canonical" href="https://stahledigital.se/verkstaden/skruvat">
<script>
/* Skruvat har flyttat till https://stahledigital.se/verkstaden/skruvat (2026-09-18).
   Det som var sparat i telefonen på den här adressen följer med i #-delen av länken.
   #-delen skickas aldrig till någon server; sidan på den nya adressen läser den och tar bort den. */
(function(){var K=['skruvat','skruvat_seen'],d={},n=0;try{K.forEach(function(k){var v=localStorage.getItem(k);if(v!==null){d[k]=v;n++;}});}catch(e){}
var h='';if(n){try{h='#flytt='+btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){h='';}}
location.replace('https://stahledigital.se/verkstaden/skruvat'+location.search+h);})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://stahledigital.se/verkstaden/skruvat"></noscript>
<style>body{font:17px/1.5 system-ui,sans-serif;background:#f6f5f1;color:#161616;margin:0;padding:48px 20px}a{color:#b8431f;font-weight:600}</style>
</head>
<body>
<p><b>Skruvat</b> har flyttat till <a href="https://stahledigital.se/verkstaden/skruvat">stahledigital.se/verkstaden/skruvat</a>.</p>
</body>
</html>
